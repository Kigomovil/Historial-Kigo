<div class="label">Número Pedido</div><input id="ePedido" class="input" style="padding-right:14px"><div class="label">Nombre Cliente</div><input id="eCliente" class="input" style="padding-right:14px"><div class="label">Fecha</div><input id="eFecha" type="date" class="input" style="padding-right:14px"><div class="label">Repartidor</div><input id="eRep" class="input" style="padding-right:14px"><div class="label">Tipo Servicio</div><select id="eTipo" class="input" style="padding-right:14px"><option value="moto">Moto Mandado</option><option value="transporte">Transporte</option></select><div class="label">Precio / Total</div><input id="eTotal" type="number" class="input" style="padding-right:14px"><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-no" onclick="guardarEdit()">Guardar</button><button class="btn-si" onclick="cerrarEdit()" style="background:#6b7280">Cancelar</button></div></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM",
  authDomain: "registro-ventas-kigo.firebaseapp.com",
  databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com",
  projectId: "registro-ventas-kigo",
  storageBucket: "registro-ventas-kigo.firebasestorage.app",
  messagingSenderId: "494693818399",
  appId: "1:494693818399:web:34312307ec5cd52190752a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let tipoActual='moto';
function clearInput(id){ const el=document.getElementById(id); el.value=''; if(el.tagName==='SELECT') el.selectedIndex=0; calcTotal(); if(id==='cliente') ocultarSugerencias(); }
function resetFechaHoy(){ document.getElementById('fechaVenta').value=new Date().toISOString().split('T')[0]; }
function setTipo(t){ tipoActual=t; document.getElementById('btnMoto').className=t==='moto'?'tipo active':'tipo'; document.getElementById('btnTrans').className=t==='transporte'?'tipo active':'tipo'; lucide.createIcons(); }
function calcTotal(){ let p=parseFloat(document.getElementById('precio').value)||0; let d=parseFloat(document.getElementById('descuento').value)||0; let tot=p-d; if(tot<0) tot=0; document.getElementById('totalTxt').innerText='$ '+tot.toFixed(2); return tot; }
function showTab(n){ document.getElementById('vistaRegistro').style.display=n==='Registro'?'block':'none'; document.getElementById('vistaHistorial').style.display=n==='Historial'?'block':'none'; document.getElementById('vistaClientes').style.display=n==='Clientes'?'block':'none'; document.getElementById('vistaPresupuesto').style.display=n==='Presupuesto'?'block':'none'; document.getElementById('vistaRepartidores').style.display=n==='Repartidores'?'block':'none'; document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active')); document.getElementById('nav'+n).classList.add('active'); window.scrollTo(0,0); if(n==='Clientes') renderClientesImagen(); if(n==='Repartidores') renderReps(); if(n==='Presupuesto') renderPresupuesto(); if(n==='Historial') aplicarFiltros(); }
(function(){ resetFechaHoy(); document.getElementById('fechaTop').innerText=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' - '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true}); })();
const mesesN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let mesSel=new Date().getMonth();
function renderMeses(){ document.getElementById('mesesBox').innerHTML=mesesN.map((m,i)=>`<button class="mes ${i===mesSel?'active':''}" onclick="selMes(${i})">${m}</button>`).join(''); document.getElementById('filtroMesAnio').innerHTML=`<option value="">Todos</option>`+mesesN.map(m=>`<option>${m} 2026</option>`).join(''); }
function selMes(i){ mesSel=i; filtroTiempo='mes'; pagina=1; document.getElementById('bloqueMeses').style.display='block'; document.querySelectorAll('.filtro-tab').forEach(b=>b.classList.remove('active')); document.getElementById('fBusMes').classList.add('active'); document.getElementById('fMes').classList.add('active'); document.getElementById('mesTitulo').innerText=mesesN[mesSel]+' 2026'; renderMeses(); aplicarFiltros(); renderClientesImagen(); renderReps(); renderPresupuesto(); }
renderMeses();
function toggleMeses(){ const b=document.getElementById('bloqueMeses'); const isHidden=b.style.display==='none'; b.style.display=isHidden?'block':'none'; if(isHidden){ filtroTiempo='mes'; } else { filtroTiempo='todos'; } pagina=1; aplicarFiltros(); }
let filtroTiempo='todos';
function filtrarTiempo(t){ filtroTiempo=t; document.querySelectorAll('.filtro-tab').forEach(b=>b.classList.remove('active')); document.getElementById(t==='todos'?'fTodos':t==='ayer'?'fAyer':t==='semana'?'fSemana':t==='mes'?'fMes':'fBusMes').classList.add('active'); if(t==='todos'){ document.getElementById('bloqueMeses').style.display='none'; document.getElementById('mesTitulo').innerText='Todos - '+ventasCache.length+' servicios'; } pagina=1; aplicarFiltros(); }
</script>
<script>
let ventasCache=[], ventasFiltradas=[];
let pagina=1; const POR_PAGINA=600;
let idEditar=null, idEliminar=null;
let clientesDB={}, clienteEditId=null, clienteDelId=null, clienteDelNombre=null;
let repartidoresDB={}, repEditId=null, repDelId=null;
let fotoTempNuevo='', fotoTempEdit='';
let presuTipo='dia';

db.ref('clientes').on('value',s=>{ clientesDB=s.val()||{}; renderClientesImagen(); });
db.ref('repartidores').on('value',s=>{ repartidoresDB=s.val()||{}; renderReps(); refreshRepsSelect(); renderPresupuesto(); refreshPresuSelect(); });
db.ref('ventas').on('value',snap=>{
 const val=snap.val()||{};

function abrirRepEdit(id){ const r=repartidoresDB[id]; if(!r) return; repEditId=id; fotoTempEdit=r.foto||''; document.getElementById('repEditTitle').innerText='Editar Repartidor'; document.getElementById('reNombre').value=r.nombre||''; document.getElementById('reTel').value=r.telefono||''; document.getElementById('reMoto').value=r.moto||''; document.getElementById('reEstado').value=r.estado||'Disponible'; document.getElementById('reTarifaM').value=r.tarifaM||5; document.getElementById('reTarifaT').value=r.tarifaT||80; const prev=document.getElementById('editPreview'); if(r.foto){ prev.src=r.foto; prev.style.display='block'; } else { prev.style.display='none'; } document.getElementById('reFoto').value=''; document.getElementById('overlayRepEdit').style.display='flex'; }
function cerrarRepEdit(){ document.getElementById('overlayRepEdit').style.display='none'; repEditId=null; fotoTempEdit=''; }
function guardarRepEdit(){ if(!repEditId) return; const data={ nombre:document.getElementById('reNombre').value.trim(), telefono:document.getElementById('reTel').value.trim(), moto:document.getElementById('reMoto').value.trim(), estado:document.getElementById('reEstado').value, tarifaM:parseFloat(document.getElementById('reTarifaM').value)||5, tarifaT:parseFloat(document.getElementById('reTarifaT').value)||80, foto:fotoTempEdit||repartidoresDB[repEditId].foto||'' }; if(!data.nombre){ alert('Nombre requerido'); return; } db.ref('repartidores/'+repEditId).update(data).then(()=>{ cerrarRepEdit(); }); }
function abrirRepDel(id,nombre){ repDelId=id; document.getElementById('repDelName').innerText='Repartidor: '+nombre; document.getElementById('overlayRepDel').style.display='flex'; lucide.createIcons(); }
function cerrarRepDel(){ document.getElementById('overlayRepDel').style.display='none'; repDelId=null; }
function confirmarRepDel(){ if(!repDelId) return; db.ref('repartidores/'+repDelId).remove().then(()=>{ cerrarRepDel(); }); }
function refreshRepsSelect(){ const sel=document.getElementById('repartidor'); const lista=Object.values(repartidoresDB).map(r=>r.nombre); const unicos=[...new Set([...lista])]; sel.innerHTML='<option value="">Seleccionar repartidor</option>'+unicos.map(r=>`<option value="${r}">${r}</option>`).join(''); }

function aplicarFiltros(){
 let lista=[...ventasCache];
 const q=document.getElementById('buscarCliente').value.toLowerCase();
 const rep=document.getElementById('filtroRepartidor').value;
 const fechaEx=document.getElementById('filtroFechaExacta').value;

 if(filtroTiempo!=='todos'){
   lista=lista.filter(v=>{ if(!v.fecha) return true; const d=new Date(v.fecha+'T12:00:00'); return d.getMonth()===mesSel; });
   if(filtroTiempo==='ayer'){ const ayer=new Date(); ayer.setDate(ayer.getDate()-1); const ayStr=ayer.toISOString().split('T')[0]; lista=lista.filter(v=>v.fecha===ayStr); }
   if(filtroTiempo==='semana'){ const hace7=new Date(); hace7.setDate(new Date().getDate()-7); lista=lista.filter(v=>{ const d=new Date(v.fecha+'T12:00:00'); return d>=hace7; }); }
 }

 if(q) lista=lista.filter(v=>v.cliente.toLowerCase().includes(q));
 if(rep) lista=lista.filter(v=>v.repartidor===rep);
 if(fechaEx) lista=lista.filter(v=>v.fecha===fechaEx);
 ventasFiltradas=lista; pagina=1; renderTablaPaginada();
}
function renderTablaPaginada(){
 const total=ventasFiltradas.length; const totalPags=Math.max(1,Math.ceil(total/POR_PAGINA)); if(pagina>totalPags) pagina=totalPags;
 document.getElementById('pagActual').innerText=pagina+' / '+totalPags; const inicio=(pagina-1)*POR_PAGINA; const lista=ventasFiltradas.slice(inicio,inicio+POR_PAGINA); const tbody=document.getElementById('tbodyVentas');
 document.getElementById('countOrdenes').innerText=total; document.getElementById('mostrandoTxt').innerText=`Mostrando ${lista.length} de ${total} resultados`;
 if(!lista.length){ tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:#999;padding:20px">Sin ventas - cambia a Todos para ver los 507</td></tr>'; return; }
 tbody.innerHTML=lista.map(v=>{
   const esPagado=v.estado==='Pagado'; const pagaMostrar=esPagado?(v.pagaKigoBase??v.pagaKigo??0):0; const ganMostrar=esPagado?((v.total||0)-pagaMostrar):(v.total||0);
   return `<tr><td><b>${v.pedido}</b><br><small style="color:#6b7280">${v.fecha}</small></td><td><div style="display:flex;gap:8px;align-items:center"><div style="width:28px;height:28px;background:#0a9a4a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff"><i data-lucide="bike" style="width:14px"></i></div><div><b>${v.cliente}</b><br><small style="color:#6b7280">${v.tipo==='moto'?'Moto Mandado':'Transporte'} • Cuota $${pagaMostrar}</small></div></div></td><td>${v.repartidor||'--'}</td><td><b>$${(v.total||0).toLocaleString('es-MX')}</b></td><td>$${pagaMostrar.toLocaleString('es-MX')}</td><td style="color:#0a7a2e;font-weight:700">$${ganMostrar.toLocaleString('es-MX')}</td><td><button class="${esPagado?'badge-pagado':'badge-debe'}" onclick="toggleEstado('${v.id}')">${esPagado?'Pagado':'Debe'}</button></td><td><button class="acc-btn" onclick="abrirEdit('${v.id}')"><i data-lucide="pencil" style="width:14px"></i></button><button class="acc-btn" style="border-color:#fca5a5" onclick="abrirDel('${v.id}')"><i data-lucide="trash-2" style="width:14px;color:#dc2626"></i></button></td></tr>`;
 }).join(''); lucide.createIcons();
}
function cambiarPag(dir){ const totalPags=Math.max(1,Math.ceil(ventasFiltradas.length/POR_PAGINA)); pagina+=dir; if(pagina<1) pagina=1; if(pagina>totalPags) pagina=totalPags; renderTablaPaginada(); document.getElementById('tablaWrap').scrollTop=0; }
function toggleEstado(id){ const v=ventasCache.find(x=>x.id===id); if(!v) return; if(v.estado==='Pagado'){ db.ref('ventas/'+id).update({estado:'Debe', pagaKigo:0, ganancia:v.total}); }else{ const base=v.pagaKigoBase??v.pagaKigo??0; db.ref('ventas/'+id).update({estado:'Pagado', pagaKigo:base, ganancia:(v.total||0)-base}); } }
function abrirEdit(id){ const v=ventasCache.find(x=>x.id===id); if(!v) return; idEditar=id; document.getElementById('ePedido').value=v.pedido||''; document.getElementById('eCliente').value=v.cliente||''; document.getElementById('eFecha').value=v.fecha||''; document.getElementById('eRep').value=v.repartidor||''; document.getElementById('eTipo').value=v.tipo||'moto'; document.getElementById('eTotal').value=v.total||0; document.getElementById('overlayEdit').style.display='flex'; }
function cerrarEdit(){ document.getElementById('overlayEdit').style.display='none'; idEditar=null; }
function guardarEdit(){
 if(!idEditar) return; const total=parseFloat(document.getElementById('eTotal').value)||0; const nombreRep=document.getElementById('eRep').value; const tipo=document.getElementById('eTipo').value;
 const tarifaActual=getTarifaRepartidor(nombreRep, tipo);
 const base=tarifaActual!==null?tarifaActual:(ventasCache.find(x=>x.id===idEditar)?.pagaKigoBase?? 5);
 const v=ventasCache.find(x=>x.id===idEditar); const esPagado=v.estado==='Pagado';
 const data={ pedido:document.getElementById('ePedido').value, cliente:document.getElementById('eCliente').value, fecha:document.getElementById('eFecha').value, repartidor:nombreRep, tipo:tipo, total:total, pagaKigoBase:base, pagaKigo:esPagado?base:0, ganancia:esPagado?total-base:total }; db.ref('ventas/'+idEditar).update(data).then(()=>{ cerrarEdit(); });
}
function abrirDel(id){ idEliminar=id; document.getElementById('overlayDel').style.display='flex'; lucide.createIcons(); }
function cerrarDel(){ document.getElementById('overlayDel').style.display='none'; idEliminar=null; }
function confirmarDel(){ if(!idEliminar) return; db.ref('ventas/'+idEliminar).remove().then(()=>{ cerrarDel(); }); }
function limpiarFiltros(){ document.getElementById('buscarCliente').value=''; document.getElementById('filtroRepartidor').value=''; document.getElementById('filtroFechaExacta').value=''; filtroTiempo='todos'; mesSel=new Date().getMonth(); pagina=1; document.getElementById('bloqueMeses').style.display='none'; document.querySelectorAll('.filtro-tab').forEach(b=>b.classList.remove('active')); document.getElementById('fTodos').classList.add('active'); renderMeses(); aplicarFiltros(); }
lucide.createIcons();
function registrarVenta(){
 let cliente=document.getElementById('cliente').value.trim();
 let fechaInput=document.getElementById('fechaVenta').value;
 let precio=parseFloat(document.getElementById('precio').value)||0;
 let repartidor=document.getElementById('repartidor').value;
 let total=calcTotal();
 if(!cliente||!fechaInput||precio<=0){ alert('Completa datos'); return; }
 let tarifa=getTarifaRepartidor(repartidor, tipoActual);
 let pagaKigoBase = tarifa!==null? tarifa : 5;
 let ganancia=total-pagaKigoBase;
 const f=new Date(fechaInput+'T12:00:00');
 const data={ cliente, tipo:tipoActual, precio, descuento:parseFloat(document.getElementById('descuento').value)||0, total, pagaKigo:pagaKigoBase, pagaKigoBase:pagaKigoBase, tarifaAplicada:pagaKigoBase, ganancia, repartidor, fecha:fechaInput, fechaTxt:f.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}), timestamp:Date.now(), estado:'Pagado', pedido:'#'+Math.floor(1000+Math.random()*9000) };
 db.ref('ventas').push(data).then(()=>{
   const ov=document.getElementById('overlayExito'); ov.style.display='flex'; lucide.createIcons(); setTimeout(()=>ov.style.display='none',2000);
   setTimeout(()=>{ document.getElementById('cliente').value=''; document.getElementById('precio').value=''; document.getElementById('descuento').value=''; document.getElementById('repartidor').value=''; document.getElementById('totalTxt').innerText='$ 0.00'; document.getElementById('fechaVenta').value=new Date().toISOString().split('T')[0]; mesSel=new Date(fechaInput+'T12:00:00').getMonth(); filtroTiempo='todos'; renderMeses(); showTab('Historial'); aplicarFiltros(); },2100);
 });
}
</script>
</body>
