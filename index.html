<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registro Ventas - Kigo</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f5f7}
.app{max-width:500px;margin:0 auto;background:#fff;min-height:100dvh;display:flex;flex-direction:column}
.header{background:#111;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.form-box{padding:16px;background:#fff;border-bottom:1px solid #eee}
.input{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;font-weight:600;outline:none;background:#f9fafb;margin-top:8px}
.input:focus{border-color:#111;background:#fff}
.btn-add{width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:900;margin-top:12px;cursor:pointer}
.stats{display:flex;gap:10px;padding:14px}
.stat{flex:1;background:#f7f7f8;border:1px solid #eee;border-radius:14px;padding:12px;text-align:center}
.search-box{padding:0 16px 12px;display:flex;gap:8px}
.venta-card{background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;margin:0 16px 10px 16px;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div style="width:40px;height:40px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center"><i data-lucide="store" style="width:20px;color:#111"></i></div>
<div><div style="font-weight:900;font-size:16px">Registro de Ventas</div><div style="font-size:11px;opacity:.7">Base: registro-ventas-kigo</div></div>
<div style="margin-left:auto;background:#22c55e;color:#fff;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800">EN VIVO</div>
</div>

<div class="form-box">
<div style="font-weight:800;font-size:13px">Nueva Venta</div>
<input id="producto" class="input" placeholder="Producto / Servicio (ej: Entrega moto)">
<input id="cliente" class="input" placeholder="Cliente (opcional)">
<div style="display:flex;gap:8px">
<input id="monto" type="number" class="input" placeholder="Monto $ MXN" style="flex:1">
<select id="metodo" class="input" style="flex:1"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option></select>
</div>
<input id="nota" class="input" placeholder="Nota (opcional)">
<button class="btn-add" onclick="guardarVenta()">💾 Guardar Venta</button>
</div>

<div class="stats">
<div class="stat"><div id="totalHoy" style="font-size:20px;font-weight:900;color:#111">$0</div><div style="font-size:10px;color:#666;font-weight:700">HOY</div></div>
<div class="stat"><div id="totalGeneral" style="font-size:20px;font-weight:900;color:#E53935">$0</div><div style="font-size:10px;color:#666;font-weight:700">TOTAL</div></div>
<div class="stat"><div id="totalVentas" style="font-size:20px;font-weight:900;color:#111">0</div><div style="font-size:10px;color:#666;font-weight:700">VENTAS</div></div>
</div>

<div class="search-box">
<input id="buscador" class="input" style="margin:0" placeholder="🔍 Buscar producto, cliente..." oninput="filtrar()">
<input id="filtroFecha" type="date" class="input" style="margin:0;width:150px" onchange="filtrar()">
</div>

<div id="listaVentas" style="padding-bottom:20px"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM",
  authDomain: "registro-ventas-kigo.firebaseapp.com",
  databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com",
  projectId: "registro-ventas-kigo",
  storageBucket: "registro-ventas-kigo.firebasestorage.app",
  messagingSenderId: "494693818399",
  appId: "1:494693818399:web:34312307ec5cd52190752a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let ventasCache = [];

function guardarVenta(){
  const producto = document.getElementById('producto').value.trim();
  const cliente = document.getElementById('cliente').value.trim();
  const monto = parseFloat(document.getElementById('monto').value);
  const metodo = document.getElementById('metodo').value;
  const nota = document.getElementById('nota').value.trim();
  if(!producto ||!monto){ alert('Pon producto y monto'); return; }
  const ahora = new Date();
  const data = {
    producto, cliente: cliente||'Mostrador', monto, metodo, nota,
    fecha: ahora.toISOString().split('T')[0],
    fechaTxt: ahora.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}),
    hora: ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),
    timestamp: Date.now()
  };
  db.ref('ventas').push(data).then(()=>{
    document.getElementById('producto').value=''; document.getElementById('monto').value=''; document.getElementById('cliente').value=''; document.getElementById('nota').value='';
    alert('✅ Venta guardada en Firebase nueva');
  });
}

db.ref('ventas').on('value', snap=>{
  const data = snap.val()||{};
  ventasCache = Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>b.timestamp-a.timestamp);
  renderVentas(ventasCache);
  calcularTotales(ventasCache);
});

function calcularTotales(lista){
  const hoy = new Date().toISOString().split('T')[0];
  let tHoy=0, tGen=0;
  lista.forEach(v=>{ tGen+=parseFloat(v.monto)||0; if(v.fecha===hoy) tHoy+=parseFloat(v.monto)||0; });
  document.getElementById('totalHoy').innerText='$'+tHoy.toLocaleString();
document.getElementById('totalGeneral').innerText='$'+tGen.toLocaleString();
document.getElementById('totalVentas').innerText=lista.length;
}
