<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registro de Venta</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#e8e8e8;display:flex;justify-content:center}
.phone{width:100%;max-width:410px;background:#f5f5f5;min-height:100dvh;position:relative;box-shadow:0 0 0 12px #111, 0 0 0 14px #333;border-radius:40px;overflow:hidden;margin:20px 10px}
.top{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.card{background:#fff;border-radius:20px;margin:8px 14px;padding:16px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.title{color:#0a7a2e;font-weight:900;font-size:28px;letter-spacing:-.5px;margin:4px 0 16px}
.label{font-size:13px;font-weight:500;color:#333;margin:14px 0 6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input{width:100%;padding:12px 38px 12px 14px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;background:#fff;outline:none}
.input:focus{border-color:#0a7a2e}
.btn-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#999;cursor:pointer;z-index:2}
.tipo-box{display:flex;gap:8px}
.tipo{flex:1;padding:11px;border-radius:12px;border:1.5px solid #0a7a2e;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.tipo.active{background:#0a7a2e;color:#fff}
.total-box{background:#d1e7d6;border:1.5px solid #a3c9a8;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.btn-reg{width:100%;margin-top:16px;background:#0a7a2e;color:#fff;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0 18px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#888;cursor:pointer;font-weight:600}
.nav-item.active{color:#0a7a2e}
.dot{width:6px;height:6px;background:#0a7a2e;border-radius:50%;margin-bottom:2px}
</style>
</head>
<body>
<div class="phone">
<div class="top"><span id="fechaTop">02 Oct 2026 - 9:41 PM</span><span>☀️ 24°C</span></div>

<div id="vistaRegistro" class="card">
<div class="title">Registro de Venta</div>

<div class="label">Nombre del Cliente</div>
<div class="input-wrap">
<input id="cliente" class="input" placeholder="Ej: Juan Pérez" oninput="calcTotal()">
<button class="btn-x" onclick="clearInput('cliente')">x</button>
</div>

<div class="label">Tipo de Servicio</div>
<div class="tipo-box">
<button id="btnMoto" class="tipo active" onclick="setTipo('moto')">🏍️ Moto Mandado</button>
<button id="btnTrans" class="tipo" onclick="setTipo('transporte')">🚗 Transporte</button>
</div>

<div class="label">Precio</div>
<div class="input-wrap">
<input id="precio" type="number" class="input" placeholder="$ 0.00" oninput="calcTotal()">
<button class="btn-x" onclick="clearInput('precio')">x</button>
</div>

<div class="label">Repartidor</div>
<div class="input-wrap">
<select id="repartidor" class="input" style="padding-right:38px">
<option value="">Seleccionar repartidor</option>
<option value="Juan">Juan</option>
<option value="Carlos">Carlos</option>
<option value="Luis">Luis</option>
</select>
<button class="btn-x" onclick="clearInput('repartidor')">x</button>
</div>

<div class="label">Descuento</div>
<div class="input-wrap">
<input id="descuento" type="number" class="input" placeholder="$ 0.00 (opcional)" oninput="calcTotal()">
<button class="btn-x" onclick="clearInput('descuento')">x</button>
</div>

<div class="total-box">
<span style="font-size:14px">Total</span>
<span id="totalTxt" style="font-size:28px;font-weight:900;color:#0a7a2e">$ 0.00</span>
</div>

<button class="btn-reg" onclick="registrarVenta()">✓ Registrar Venta</button>
</div>

<div id="vistaHistorial" class="card" style="display:none">
<div class="title" style="font-size:22px">Historial</div>
<div id="listaVentas"></div>
</div>

<div id="vistaClientes" class="card" style="display:none">
<div class="title" style="font-size:22px">Clientes</div>
<div id="listaClientes" style="font-size:13px;color:#666">Se genera automático al registrar</div>
</div>

<div id="vistaRepartidores" class="card" style="display:none">
<div class="title" style="font-size:22px">Repartidores</div>
<div style="display:flex;gap:8px;margin-top:10px">
<div style="position:relative;flex:1">
<input id="nuevoRep" class="input" placeholder="Nombre repartidor">
<button class="btn-x" onclick="clearInput('nuevoRep')">x</button>
</div>
<button onclick="addRepartidor()" style="background:#0a7a2e;color:#fff;border:none;border-radius:10px;padding:0 14px;font-weight:800">+</button>
</div>
<div id="listaReps" style="margin-top:12px"></div>
</div>

<div class="nav">
<div id="navRegistro" class="nav-item active" onclick="showTab('Registro')"><div class="dot"></div>📝 Registro</div>
<div id="navHistorial" class="nav-item" onclick="showTab('Historial')">🕒 Historial</div>
<div id="navClientes" class="nav-item" onclick="showTab('Clientes')">👥 Clientes</div>
<div id="navRepartidores" class="nav-item" onclick="showTab('Repartidores')">👤 Repartidores</div>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM",
  authDomain: "registro-ventas-kigo.firebaseapp.com",
  databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com",
  projectId: "registro-ventas-kigo",
  storageBucket: "registro-ventas-kigo.firebasestorage.app",
  messagingSenderId: "494693818399",
  appId: "1:494693818399:web:34312307ec5cd52190752a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let tipoActual='moto';
function clearInput(id){ document.getElementById(id).value=''; calcTotal(); }
function setTipo(t){ tipoActual=t; document.getElementById('btnMoto').className=t==='moto'?'tipo active':'tipo'; document.getElementById('btnTrans').className=t==='transporte'?'tipo active':'tipo'; }
function calcTotal(){
 let p=parseFloat(document.getElementById('precio').value)||0;
 let d=parseFloat(document.getElementById('descuento').value)||0;
 let tot=p-d; if(tot<0) tot=0;
 document.getElementById('totalTxt').innerText='$ '+tot.toFixed(2);
 return tot;
}
function showTab(n){
 document.getElementById('vistaRegistro').style.display=n==='Registro'?'block':'none';
 document.getElementById('vistaHistorial').style.display=n==='Historial'?'block':'none';
 document.getElementById('vistaClientes').style.display=n==='Clientes'?'block':'none';
 document.getElementById('vistaRepartidores').style.display=n==='Repartidores'?'block':'none';
 document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
 document.getElementById('nav'+n).classList.add('active');
}
</script>
<script>
function registrarVenta(){
 let cliente=document.getElementById('cliente').value.trim();
 let precio=parseFloat(document.getElementById('precio').value)||0;
 let descuento=parseFloat(document.getElementById('descuento').value)||0;
 let repartidor=document.getElementById('repartidor').value;
 let total=calcTotal();
 if(!cliente){ alert('Pon nombre del cliente'); return; }
 if(precio<=0){ alert('Pon precio'); return; }
 const data={
   cliente, tipo:tipoActual, precio, descuento, total, repartidor,
   fecha:new Date().toISOString().split('T')[0],
   fechaTxt:new Date().toLocaleString('es-MX'),
   timestamp:Date.now()
 };
 db.ref('ventas').push(data).then(()=>{
   alert('✅ Venta registrada en Firebase nueva');
   document.getElementById('cliente').value='';
   document.getElementById('precio').value='';
   document.getElementById('descuento').value='';
   document.getElementById('repartidor').value='';
   calcTotal();
 });
}

let ventasCache=[];
db.ref('ventas').on('value',snap=>{
 const val=snap.val()||{};
 ventasCache=Object.entries(val).map(([id,v])=>({id,...v})).sort((a,b)=>b.timestamp-a.timestamp);
 renderHistorial();
 renderClientes();
});

function renderHistorial(){
 const box=document.getElementById('listaVentas');
 if(!ventasCache.length){ box.innerHTML='<div style="text-align:center;color:#999;padding:20px">Sin ventas</div>'; return; }
 box.innerHTML=ventasCache.map(v=>`
  <div style="background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
    <div style="flex:1">
      <div style="font-weight:800;font-size:13px">${v.cliente} - ${v.tipo==='moto'?'Moto Mandado':'Transporte'}</div>
      <div style="font-size:11px;color:#666">${v.fechaTxt} • Rep: ${v.repartidor||'--'}</div>
      <div style="font-size:12px;color:#0a7a2e;font-weight:800">$${v.total} ${v.descuento>0?`(Desc $${v.descuento})`:''}</div>
    </div>
    <button onclick="borrarVenta('${v.id}')" style="width:28px;height:28px;border-radius:50%;border:1px solid #ffcccc;background:#fff;color:#E53935;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer">x</button>
  </div>
 `).join('');
}

function borrarVenta(id){
 if(!confirm('¿Borrar esta venta?')) return;
 db.ref('ventas/'+id).remove();
}

function renderClientes(){
 const map={};
 ventasCache.forEach(v=>{ if(!map[v.cliente]) map[v.cliente]={total:0,veces:0}; map[v.cliente].total+=v.total; map[v.cliente].veces++; });
 const box=document.getElementById('listaClientes');
 const arr=Object.entries(map);
 if(!arr.length){ box.innerHTML='Se genera automático al registrar'; return; }
 box.innerHTML=arr.map(([nombre,d])=>`
  <div style="background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
    <div style="flex:1"><b>${nombre}</b><br><small>${d.veces} compras - Total $${d.total.toFixed(2)}</small></div>
    <button onclick="borrarCliente('${nombre}')" style="width:28px;height:28px;border-radius:50%;border:1px solid #ffcccc;background:#fff;color:#E53935;font-weight:900">x</button>
  </div>
 `).join('');
}

function borrarCliente(nombre){
 if(!confirm('¿Borrar todas las ventas de '+nombre+'?')) return;
 ventasCache.filter(v=>v.cliente===nombre).forEach(v=>{ db.ref('ventas/'+v.id).remove(); });
}

// Repartidores
let reps=JSON.parse(localStorage.getItem('reps')||'["Juan","Carlos","Luis"]');
function refreshReps(){
 const sel=document.getElementById('repartidor');
 sel.innerHTML='<option value="">Seleccionar repartidor</option>'+reps.map(r=>`<option value="${r}">${r}</option>`).join('');
 document.getElementById('listaReps').innerHTML=reps.map(r=>`
  <div style="background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
    <span style="font-weight:600">${r}</span>
    <button onclick="borrarRep('${r}')" style="width:28px;height:28px;border-radius:50%;border:1px solid #ffcccc;background:#fff;color:#E53935;font-weight:900">x</button>
  </div>
 `).join('');
}
function addRepartidor(){
 let n=document.getElementById('nuevoRep').value.trim();
 if(!n) return;
 reps.push(n); localStorage.setItem('reps',JSON.stringify(reps)); document.getElementById('nuevoRep').value=''; refreshReps();
}
function borrarRep(n){
 if(!confirm('¿Borrar repartidor '+n+'?')) return;
 reps=reps.filter(r=>r!==n); localStorage.setItem('reps',JSON.stringify(reps)); refreshReps();
}
refreshReps();

// Fecha top
const ahora=new Date();
document.getElementById('fechaTop').innerText=ahora.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})+' - '+ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true});
lucide.createIcons();
</script>
</body>
</html>
